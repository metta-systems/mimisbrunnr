[package]
name = "mimisbrunnr-fuse"
description = "FUSE bridge for mounting Mímisbrunnr path projections as Unix filesystems"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
fuse = ["dep:fuser"]

[dependencies]
mimisbrunnr-index = { workspace = true }
mimisbrunnr-ontology = { workspace = true }
mimisbrunnr-query = { workspace = true }
mimisbrunnr-types = { workspace = true }
mimisbrunnr-unix = { workspace = true }
fuser = { workspace = true, optional = true }
log = { workspace = true }
roaring = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
