[module]
id = "systems.metta.unix-interop"
version = "0.1.0"
name = "Unix Path Ontology"

[requires]
"systems.metta.core" = ">=0.1"

[[tags]]
name = "unix-path"
semantics = "attribute"
value_type = "text"
description = "Where this object appears in the pool's Unix view"

[[tags]]
name = "unix-mode"
semantics = "attribute"
value_type = "int"
description = "Unix permission bits for this object"

[[tags]]
name = "unix-uid"
semantics = "attribute"
value_type = "int"

[[tags]]
name = "unix-gid"
semantics = "attribute"
value_type = "int"

[[tags]]
name = "symlink-target"
semantics = "attribute"
value_type = "text"
description = "If this entry is a symlink in the projection, what it points to"
