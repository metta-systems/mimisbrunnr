[workspace]
members = [
    "crates/types",
    "crates/storage",
    "crates/wal",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mimisbrunnr-types = { path = "crates/types" }
mimisbrunnr-storage = { path = "crates/storage" }
mimisbrunnr-wal = { path = "crates/wal" }

bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
tempfile = "3"
thiserror = "2"
