[workspace]
members = [
    "crates/types",
    "crates/storage",
    "crates/wal",
    "crates/meta",
    "crates/index",
    "crates/ontology",
    "crates/query",
    "crates/transform",
    "crates/watch",
    "crates/pool",
    "crates/engine",
    "crates/unix",
    "crates/fuse",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mimisbrunnr-types = { path = "crates/types" }
mimisbrunnr-storage = { path = "crates/storage" }
mimisbrunnr-wal = { path = "crates/wal" }
mimisbrunnr-meta = { path = "crates/meta" }
mimisbrunnr-index = { path = "crates/index" }
mimisbrunnr-ontology = { path = "crates/ontology" }
mimisbrunnr-query = { path = "crates/query" }
mimisbrunnr-transform = { path = "crates/transform" }
mimisbrunnr-watch = { path = "crates/watch" }
mimisbrunnr-pool = { path = "crates/pool" }
mimisbrunnr-engine = { path = "crates/engine" }
mimisbrunnr-unix = { path = "crates/unix" }
mimisbrunnr-fuse = { path = "crates/fuse" }

blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
fuser = { version = "0.17" }
roaring = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1.0"
zstd = "0.13"
